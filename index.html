<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈明教授 · 出诊安排</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f7f5f0;
            color: #333;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 28px 16px;
            background: linear-gradient(135deg, #6b2d2d 0%, #8b4040 100%);
            border-radius: 16px;
            margin-bottom: 16px;
            color: #ede7dd;
            box-shadow: 0 4px 16px rgba(107, 45, 45, 0.25);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: 15px;
            opacity: 0.9;
        }

        /* Month tabs */
        .month-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 0;
            justify-content: center;
        }

        .month-tab {
            background: white;
            border: 1px solid #ddd8cf;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
            font-weight: 500;
        }

        .month-tab.active {
            background: #6b2d2d;
            color: #ede7dd;
            border-color: #6b2d2d;
        }

        .month-tab:active {
            transform: scale(0.97);
        }

        .month-label {
            text-align: center;
            padding: 14px 0;
            font-size: 18px;
            font-weight: 600;
            color: #3a2a2a;
        }

        /* Calendar */
        .calendar {
            background: white;
            border-radius: 14px;
            padding: 16px 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }

        .cal-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .cal-week {
            display: grid;
            grid-template-columns: 36px repeat(7, 1fr);
            gap: 3px;
            padding: 3px 0;
        }

        .cal-week + .cal-week {
            border-top: 2px solid #b8a88a;
        }

        .cal-corner {
            border-radius: 6px;
        }

        .cal-weekday {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #3a2a2a;
            padding: 10px 0;
            background: #f5f2ec;
            border-radius: 6px;
        }

        .cal-header {
            display: grid;
            grid-template-columns: 36px repeat(7, 1fr);
            gap: 3px;
            padding-bottom: 0;
        }

        .cal-period {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #6b2d2d;
            background: #f5f2ec;
            border-radius: 6px;
            min-height: 52px;
        }

        .cal-period.am { background: #f7f0e8; }
        .cal-period.pm { background: #e8eef4; }

        .cal-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            border-radius: 6px;
            padding: 4px 2px;
            gap: 2px;
        }

        .cal-cell.am { background: #fdfbf7; }
        .cal-cell.pm { background: #f7f9fb; }
        .cal-cell.has-schedule { background: #f0ece4; }

        .cal-cell.today {
            background: #faf6f2;
            border: 2px solid #c0392b;
        }

        .cal-cell.today.has-schedule {
            background: #f5ede4;
        }

        .cal-cell .cal-day-num {
            font-size: 14px;
            color: #666;
            line-height: 1.2;
            font-weight: 500;
        }

        .cal-cell.today .cal-day-num {
            color: #c0392b;
            font-weight: 700;
        }

        .cal-tag {
            font-size: 13px;
            padding: 3px 5px;
            border-radius: 4px;
            color: white;
            font-weight: 600;
            white-space: nowrap;
            line-height: 1.3;
        }

        .cal-tag-东城 { background: #4a6b5a; }
        .cal-tag-博爱堂 { background: #7a6328; }
        .cal-tag-弘医堂 { background: #854530; }
        .cal-tag-国医堂 { background: #3a4a6a; }
        .cal-tag-停诊 { background: #8d1f29; }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 16px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #888;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        /* Sections */
        .section {
            background: white;
            border-radius: 14px;
            padding: 18px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #3a2a2a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-icon {
            font-size: 18px;
        }

        /* Location items */
        .loc-item {
            padding: 14px;
            border-radius: 10px;
            background: #f5f2ec;
            margin-bottom: 10px;
            border-left: 3px solid transparent;
        }

        .loc-item:last-child {
            margin-bottom: 0;
        }

        .loc-item.loc-东城 { border-left-color: #4a6b5a; }
        .loc-item.loc-博爱堂 { border-left-color: #7a6328; }
        .loc-item.loc-弘医堂 { border-left-color: #854530; }
        .loc-item.loc-国医堂 { border-left-color: #3a4a6a; }

        .loc-name {
            font-size: 15px;
            font-weight: 600;
            color: #3a2a2a;
            margin-bottom: 8px;
        }

        .loc-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .loc-row:last-child {
            margin-bottom: 0;
        }

        .loc-row .icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .loc-row a {
            color: #6b2d2d;
            text-decoration: none;
            font-weight: 500;
        }

        .loc-row a:active {
            opacity: 0.7;
        }

        .loc-row .text {
            color: #666;
        }

        /* Notice */
        .notice-box {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 14px;
            color: #8c6d1f;
            line-height: 1.7;
        }

        .notice-box .notice-icon {
            font-size: 16px;
            margin-right: 6px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 16px 8px;
            font-size: 12px;
            color: #bbb;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 14px;
        }

        .loading .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e0dcd4;
            border-top-color: #6b2d2d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (min-width: 500px) {
            .container { padding: 24px; }
            .cal-tag { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            <div class="spinner"></div>
            加载中...
        </div>
    </div>

    <script>
    (function() {
        const WEEKDAY_LABELS = ['一', '二', '三', '四', '五', '六', '日'];
        const DAY_KEYS = { 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六', 0: '日' };
        const PERIODS = ['上午', '下午'];
        const LOCATION_COLORS = {
            '东城': '#4a6b5a',
            '博爱堂': '#7a6328',
            '弘医堂': '#854530',
            '国医堂': '#3a4a6a',
            '停诊': '#8d1f29'
        };

        let scheduleData;
        let viewMode = 'current'; // 'current' or 'next'

        function init() {
            loadSchedule();
        }

        async function loadSchedule() {
            try {
                const resp = await fetch('schedule.json?t=' + Date.now());
                if (!resp.ok) throw new Error('Network error');
                scheduleData = await resp.json();
                viewMode = 'current';
                render();
            } catch (e) {
                document.getElementById('app').innerHTML =
                    '<div class="loading">数据加载失败，请稍后刷新重试</div>';
            }
        }

        function getActiveData() {
            if (viewMode === 'next' && scheduleData.next) {
                var n = scheduleData.next;
                return {
                    doctor: scheduleData.doctor,
                    month: n.month,
                    regular: n.regular,
                    exceptions: n.exceptions || {},
                    locations: scheduleData.locations,
                    notice: scheduleData.notice
                };
            }
            return scheduleData;
        }

        function render() {
            const data = getActiveData();
            const [year, month] = data.month.split('-').map(Number);
            const displayMonth = month - 1;
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === displayMonth;
            const todayDate = isCurrentMonth ? today.getDate() : -1;

            const firstDay = new Date(year, displayMonth, 1);
            const lastDay = new Date(year, displayMonth + 1, 0);
            const startDow = (firstDay.getDay() + 6) % 7;
            const totalDays = lastDay.getDate();

            const monthStr = year + '年' + month + '月';
            const [curY, curM] = scheduleData.month.split('-').map(Number);
            const currentMonthStr = curY + '年' + curM + '月';

            let html = '';

            // Header
            html += '<div class="header">';
            html += '<h1>' + data.doctor + '</h1>';
            html += '<div class="subtitle">出诊安排</div>';
            html += '</div>';

            // Month nav - only show if next month data exists
            if (scheduleData.next) {
                html += '<div class="month-tabs">';
                html += '<button class="month-tab' + (viewMode === 'current' ? ' active' : '') + '" onclick="app.switchMonth(\'current\')">';
                html += currentMonthStr + '（本月）</button>';
                
                const [nextY, nextM] = scheduleData.next.month.split('-').map(Number);
                const nextMonthStr = nextY + '年' + nextM + '月';
                html += '<button class="month-tab' + (viewMode === 'next' ? ' active' : '') + '" onclick="app.switchMonth(\'next\')">';
                html += nextMonthStr + '（下月）</button>';
                html += '</div>';
            } else {
                html += '<div class="month-label">' + monthStr + '</div>';
            }

            // Calendar grid
            html += '<div class="calendar">';
            html += '<div class="cal-grid">';

            // Weekday header row
            html += '<div class="cal-header">';
            html += '<div class="cal-corner"></div>';
            WEEKDAY_LABELS.forEach(function(label) {
                html += '<div class="cal-weekday">' + label + '</div>';
            });
            html += '</div>';

            // Calculate weeks
            var totalWeeks = Math.ceil((startDow + totalDays) / 7);

            for (var w = 0; w < totalWeeks; w++) {
                var weekStart = w * 7 - startDow + 1;

                html += '<div class="cal-week">';

                PERIODS.forEach(function(period) {
                    var periodClass = period === '上午' ? 'am' : 'pm';
                    html += '<div class="cal-period ' + periodClass + '">' + period + '</div>';
                    for (var dow = 0; dow < 7; dow++) {
                        var dayNum = weekStart + dow;
                        if (dayNum >= 1 && dayNum <= totalDays) {
                            var date = new Date(year, displayMonth, dayNum);
                            var dateStr = formatDate(date);
                            var dayDow = date.getDay();
                            var dk = DAY_KEYS[dayDow];
                            var isToday = (dayNum === todayDate);

                            var loc = '';
                            var exc = data.exceptions && data.exceptions[dateStr];

                            if (typeof exc === 'string') {
                                loc = (period === '上午') ? exc : '';
                            } else {
                                if (exc && exc[period]) {
                                    loc = exc[period];
                                } else {
                                    var key = dk + period;
                                    if (data.regular && data.regular[key]) {
                                        loc = data.regular[key];
                                    }
                                }
                            }

                            var classes = 'cal-cell ' + periodClass;
                            if (isToday) classes += ' today';
                            if (loc) classes += ' has-schedule';

                            html += '<div class="' + classes + '">';
                            html += '<span class="cal-day-num">' + dayNum + '</span>';
                            if (loc) {
                                html += '<span class="cal-tag cal-tag-' + loc + '">' + loc + '</span>';
                            }
                            html += '</div>';
                        } else {
                            html += '<div class="cal-cell"></div>';
                        }
                    }
                });

                html += '</div>'; // .cal-week
            }

            html += '</div>'; // .cal-grid
            html += '</div>'; // .calendar

            // Legend
            html += '<div class="legend">';
            Object.keys(LOCATION_COLORS).forEach(function(name) {
                html += '<div class="legend-item">';
                html += '<div class="legend-dot" style="background:' + LOCATION_COLORS[name] + '"></div>';
                html += '<span>' + name + '</span>';
                html += '</div>';
            });
            html += '</div>';

            // Locations
            if (data.locations) {
                var locTimes = buildLocationTimes(data.regular);

                html += '<div class="section">';
                html += '<div class="section-title"><span class="section-icon">📍</span>出诊地点</div>';

                Object.keys(data.locations).forEach(function(key) {
                    var loc = data.locations[key];
                    html += '<div class="loc-item loc-' + key + '">';
                    html += '<div class="loc-name">' + loc.full + '</div>';
                    if (locTimes[key]) {
                        html += '<div class="loc-row">';
                        html += '<span class="icon">🕐</span>';
                        html += '<span>' + locTimes[key] + '</span>';
                        html += '</div>';
                    }
                    if (loc.phone) {
                        html += '<div class="loc-row">';
                        html += '<span class="icon">📞</span>';
                        html += '<a href="tel:' + loc.phone.replace(/-/g, '') + '">' + loc.phone + '</a>';
                        html += '</div>';
                    }
                    if (loc.address) {
                        html += '<div class="loc-row">';
                        html += '<span class="icon">📍</span>';
                        html += '<span>' + loc.address + '</span>';
                        html += '</div>';
                    }
                    html += '</div>';
                });

                html += '</div>';
            }

            // Notice
            if (data.notice) {
                html += '<div class="section">';
                html += '<div class="notice-box">';
                html += '<span class="notice-icon">ℹ️</span>' + data.notice;
                html += '</div>';
                html += '</div>';
            }

            // Footer
            html += '<div class="footer">最后更新：' + data.month + '</div>';

            document.getElementById('app').innerHTML = html;
        }

        function formatDate(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function buildLocationTimes(regular) {
            if (!regular) return {};
            var DAY_NAMES = {'一':'周一','二':'周二','三':'周三','四':'周四','五':'周五','六':'周六','日':'周日'};
            var map = {};
            Object.keys(regular).forEach(function(key) {
                var m = key.match(/^([一二三四五六日])(上午|下午)$/);
                if (!m) return;
                var loc = regular[key];
                var timeStr = '每' + DAY_NAMES[m[1]] + m[2];
                if (!map[loc]) map[loc] = [];
                map[loc].push(timeStr);
            });
            Object.keys(map).forEach(function(loc) {
                map[loc] = map[loc].join('、');
            });
            return map;
        }

        // Month switching
        window.app = {
            switchMonth: function(mode) {
                viewMode = mode;
                render();
            }
        };

        init();
    })();
    </script>
</body>
</html>
