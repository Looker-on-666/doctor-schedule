<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈明教授 · 出诊安排</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 28px 16px;
            background: linear-gradient(135deg, #4a90d9 0%, #5ba3e6 100%);
            border-radius: 16px;
            margin-bottom: 16px;
            color: white;
            box-shadow: 0 4px 16px rgba(74, 144, 217, 0.25);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: 15px;
            opacity: 0.9;
        }

        /* Month nav */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 14px 0;
        }

        .month-nav button {
            background: white;
            border: 1px solid #e0e6ed;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #666;
        }

        .month-nav button:active {
            background: #f0f4f8;
            transform: scale(0.95);
        }

        .month-label {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            min-width: 120px;
            text-align: center;
        }

        /* Calendar */
        .calendar {
            background: white;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f2f5;
        }

        .weekdays span {
            font-size: 13px;
            color: #999;
            font-weight: 500;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 13px;
            position: relative;
            gap: 2px;
            transition: transform 0.15s;
        }

        .day-cell:active {
            transform: scale(0.95);
        }

        .day-cell.empty {
            cursor: default;
        }

        .day-cell.empty:active {
            transform: none;
        }

        .day-num {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            line-height: 1;
        }

        .day-cell.other .day-num {
            color: #ccc;
        }

        .day-cell.today {
            background: #eef5fc;
        }

        .day-cell.today .day-num {
            color: #4a90d9;
            font-weight: 700;
        }

        .tag {
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 3px;
            color: white;
            font-weight: 600;
            letter-spacing: 0;
            line-height: 1.4;
        }

        .tag-东城 { background: #4a90d9; }
        .tag-博爱堂 { background: #52c41a; }
        .tag-弘医堂 { background: #fa8c16; }
        .tag-国医堂 { background: #722ed1; }
        .tag-停诊 { background: #ff4d4f; }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 16px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #888;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        /* Sections */
        .section {
            background: white;
            border-radius: 14px;
            padding: 18px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-icon {
            font-size: 18px;
        }

        /* Location items */
        .loc-item {
            padding: 14px;
            border-radius: 10px;
            background: #f8fafc;
            margin-bottom: 10px;
            border-left: 3px solid transparent;
        }

        .loc-item:last-child {
            margin-bottom: 0;
        }

        .loc-item.loc-东城 { border-left-color: #4a90d9; }
        .loc-item.loc-博爱堂 { border-left-color: #52c41a; }
        .loc-item.loc-弘医堂 { border-left-color: #fa8c16; }
        .loc-item.loc-国医堂 { border-left-color: #722ed1; }

        .loc-name {
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .loc-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .loc-row:last-child {
            margin-bottom: 0;
        }

        .loc-row .icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .loc-row a {
            color: #4a90d9;
            text-decoration: none;
            font-weight: 500;
        }

        .loc-row a:active {
            opacity: 0.7;
        }

        .loc-row .text {
            color: #666;
        }

        /* Notice */
        .notice-box {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 14px;
            color: #8c6d1f;
            line-height: 1.7;
        }

        .notice-box .notice-icon {
            font-size: 16px;
            margin-right: 6px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 16px 8px;
            font-size: 12px;
            color: #bbb;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 14px;
        }

        .loading .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e0e6ed;
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (min-width: 500px) {
            .container { padding: 24px; }
            .day-cell { font-size: 14px; }
            .tag { font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            <div class="spinner"></div>
            加载中...
        </div>
    </div>

    <script>
    (function() {
        const WEEKDAY_LABELS = ['一', '二', '三', '四', '五', '六', '日'];
        const DAY_KEYS = { 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六', 0: '日' };
        const PERIODS = ['上午', '下午'];
        const LOCATION_COLORS = {
            '东城': '#4a90d9',
            '博爱堂': '#52c41a',
            '弘医堂': '#fa8c16',
            '国医堂': '#722ed1',
            '停诊': '#ff4d4f'
        };

        let currentYear, currentMonth;

        function init() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            loadSchedule();
        }

        async function loadSchedule() {
            try {
                const resp = await fetch('schedule.json?t=' + Date.now());
                if (!resp.ok) throw new Error('Network error');
                const data = await resp.json();
                const [y, m] = data.month.split('-').map(Number);
                currentYear = y;
                currentMonth = m - 1;
                render(data);
            } catch (e) {
                document.getElementById('app').innerHTML =
                    '<div class="loading">数据加载失败，请稍后刷新重试</div>';
            }
        }

        function render(data) {
            const year = currentYear;
            const month = currentMonth;
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            const todayDate = isCurrentMonth ? today.getDate() : -1;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDow = (firstDay.getDay() + 6) % 7;
            const totalDays = lastDay.getDate();

            const monthStr = year + '年' + (month + 1) + '月';

            let html = '';

            // Header
            html += '<div class="header">';
            html += '<h1>' + data.doctor + '</h1>';
            html += '<div class="subtitle">出诊安排</div>';
            html += '</div>';

            // Month nav
            html += '<div class="month-nav">';
            html += '<button onclick="app.prevMonth()">&#9664;</button>';
            html += '<span class="month-label">' + monthStr + '</span>';
            html += '<button onclick="app.nextMonth()">&#9654;</button>';
            html += '</div>';

            // Calendar
            html += '<div class="calendar">';
            html += '<div class="weekdays">';
            WEEKDAY_LABELS.forEach(function(d) {
                html += '<span>' + d + '</span>';
            });
            html += '</div>';
            html += '<div class="days">';

            // Empty cells before first day
            for (var i = 0; i < startDow; i++) {
                html += '<div class="day-cell empty"></div>';
            }

            // Day cells
            for (var d = 1; d <= totalDays; d++) {
                var date = new Date(year, month, d);
                var dateStr = formatDate(date);
                var dow = date.getDay();
                var dk = DAY_KEYS[dow];

                var slots = [];

                // Check exceptions first
                if (data.exceptions && data.exceptions[dateStr]) {
                    slots.push({ period: '', name: data.exceptions[dateStr] });
                } else {
                    // Regular schedule
                    PERIODS.forEach(function(period) {
                        var key = dk + period;
                        if (data.regular && data.regular[key]) {
                            slots.push({ period: period, name: data.regular[key] });
                        }
                    });
                }

                var classes = 'day-cell';
                if (d === todayDate) classes += ' today';

                html += '<div class="' + classes + '">';
                html += '<span class="day-num">' + d + '</span>';
                slots.forEach(function(s) {
                    html += '<span class="tag tag-' + s.name + '">' + s.name + '</span>';
                });
                html += '</div>';
            }

            // Empty cells after last day
            var endDow = (startDow + totalDays - 1) % 7;
            if (endDow < 6) {
                for (var i = endDow + 1; i <= 6; i++) {
                    html += '<div class="day-cell empty"></div>';
                }
            }

            html += '</div>'; // .days
            html += '</div>'; // .calendar

            // Legend
            html += '<div class="legend">';
            Object.keys(LOCATION_COLORS).forEach(function(name) {
                html += '<div class="legend-item">';
                html += '<div class="legend-dot" style="background:' + LOCATION_COLORS[name] + '"></div>';
                html += '<span>' + name + '</span>';
                html += '</div>';
            });
            html += '</div>';

            // Locations
            if (data.locations) {
                html += '<div class="section">';
                html += '<div class="section-title"><span class="section-icon">📍</span>出诊地点</div>';

                Object.keys(data.locations).forEach(function(key) {
                    var loc = data.locations[key];
                    html += '<div class="loc-item loc-' + key + '">';
                    html += '<div class="loc-name">' + loc.full + '</div>';
                    if (loc.phone) {
                        html += '<div class="loc-row">';
                        html += '<span class="icon">📞</span>';
                        html += '<a href="tel:' + loc.phone.replace(/-/g, '') + '">' + loc.phone + '</a>';
                        html += '</div>';
                    }
                    if (loc.map) {
                        html += '<div class="loc-row">';
                        html += '<span class="icon">🗺️</span>';
                        html += '<a href="' + loc.map + '" target="_blank" rel="noopener">导航前往</a>';
                        html += '</div>';
                    }
                    html += '</div>';
                });

                html += '</div>';
            }

            // Notice
            if (data.notice) {
                html += '<div class="section">';
                html += '<div class="notice-box">';
                html += '<span class="notice-icon">ℹ️</span>' + data.notice;
                html += '</div>';
                html += '</div>';
            }

            // Footer
            html += '<div class="footer">最后更新：' + data.month + '</div>';

            document.getElementById('app').innerHTML = html;
        }

        function formatDate(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        // Month navigation
        window.app = {
            prevMonth: function() {
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                loadSchedule();
            },
            nextMonth: function() {
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                loadSchedule();
            }
        };

        init();
    })();
    </script>
</body>
</html>
