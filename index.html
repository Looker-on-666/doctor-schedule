<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈明教授 · 出诊安排</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f3ee;
            color: #333;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 14px;
            overflow-x: hidden;
        }

        /* Header — simple, no gradient */
        .header {
            padding: 12px 0 8px;
            margin-bottom: 10px;
            border-bottom: 2px solid #6b2d2d;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #3a2a2a;
        }

        .header .subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 2px;
        }

        /* Month tabs */
        .month-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 10px;
            border: 1px solid #c8c0b4;
            border-radius: 4px;
            overflow: hidden;
        }

        .month-tab {
            flex: 1;
            background: white;
            border: none;
            border-right: 1px solid #c8c0b4;
            padding: 8px 10px;
            font-size: 14px;
            cursor: pointer;
            color: #666;
            font-weight: 500;
        }

        .month-tab:last-child {
            border-right: none;
        }

        .month-tab.active {
            background: #6b2d2d;
            color: #fff;
        }

        .month-tab:active {
            opacity: 0.85;
        }

        .month-label {
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            font-weight: 600;
            color: #3a2a2a;
            margin-bottom: 10px;
        }

        /* Calendar */
        .calendar {
            background: white;
            border: 1px solid #d8d2c8;
            border-radius: 4px;
            padding: 10px 8px;
            margin-bottom: 12px;
        }

        .cal-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .cal-week {
            display: grid;
            grid-template-columns: 34px repeat(7, 1fr);
            gap: 2px;
            padding: 2px 0;
        }

        .cal-week + .cal-week {
            border-top: 2px solid #b8a88a;
        }

        .cal-corner {
        }

        .cal-weekday {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            padding: 8px 0;
            background: #eee9e0;
        }

        .cal-header {
            display: grid;
            grid-template-columns: 34px repeat(7, 1fr);
            gap: 2px;
            padding-bottom: 0;
        }

        .cal-period {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #6b2d2d;
            background: #f0ebe3;
            min-height: 48px;
        }

        .cal-period.am { background: #f5efe6; }
        .cal-period.pm { background: #eaeff3; }

        .cal-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 3px 1px;
            gap: 2px;
        }

        .cal-cell.am { background: #fcfaf6; }
        .cal-cell.pm { background: #f5f7f9; }
        .cal-cell.has-schedule { background: #f0ece4; }

        .cal-cell.today {
            background: #faf6f2;
            outline: 2px solid #c0392b;
            outline-offset: -1px;
        }

        .cal-cell.today.has-schedule {
            background: #f5ede4;
        }

        .cal-cell .cal-day-num {
            font-size: 13px;
            color: #666;
            line-height: 1.2;
            font-weight: 500;
        }

        .cal-cell.today .cal-day-num {
            color: #c0392b;
            font-weight: 700;
        }

        .cal-tag {
            font-size: 12px;
            padding: 2px 4px;
            color: white;
            font-weight: 600;
            white-space: nowrap;
            line-height: 1.3;
        }

        .cal-tag-东城 { background: #4a6b5a; }
        .cal-tag-博爱堂 { background: #7a6328; }
        .cal-tag-弘医堂 { background: #854530; }
        .cal-tag-国医堂 { background: #3a4a6a; }
        .cal-tag-停诊 { background: #8d1f29; }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 8px 0;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #888;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
        }

        /* Locations section */
        .loc-section {
            margin-bottom: 12px;
        }

        .loc-section-title {
            font-size: 15px;
            font-weight: 600;
            color: #3a2a2a;
            padding: 8px 0 6px;
            border-bottom: 1px solid #d8d2c8;
            margin-bottom: 0;
        }

        .loc-list {
            background: white;
            border: 1px solid #d8d2c8;
            border-top: none;
            border-radius: 0 0 4px 4px;
        }

        .loc-item {
            padding: 10px 12px;
        }

        .loc-item + .loc-item {
            border-top: 1px solid #e8e4dc;
        }

        .loc-name {
            font-size: 15px;
            font-weight: 600;
            color: #3a2a2a;
            margin-bottom: 4px;
        }

        .loc-detail {
            font-size: 13px;
            color: #666;
            line-height: 1.8;
        }

        .loc-detail a {
            color: #6b2d2d;
            text-decoration: none;
            font-weight: 500;
        }

        .loc-detail a:active {
            opacity: 0.7;
        }

        .loc-label {
            color: #999;
            margin-right: 4px;
        }

        .loc-book-btn {
            display: inline-block;
            background: #6b2d2d;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
        }

        .loc-book-btn:active {
            opacity: 0.8;
        }

        /* Notice */
        .notice {
            font-size: 13px;
            color: #8c6d1f;
            background: #fffbe6;
            border: 1px solid #ffe58f;
            border-radius: 4px;
            padding: 10px 12px;
            margin-bottom: 12px;
            line-height: 1.7;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 12px 0 4px;
            font-size: 12px;
            color: #bbb;
            border-top: 1px solid #e8e4dc;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 14px;
        }

        .loading .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e0dcd4;
            border-top-color: #6b2d2d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* QR code modal */
        .qr-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-modal {
            background: white;
            border-radius: 6px;
            padding: 20px 16px 16px;
            width: 85%;
            max-width: 300px;
            text-align: center;
        }

        .qr-modal-title {
            font-size: 15px;
            font-weight: 600;
            color: #3a2a2a;
            margin-bottom: 4px;
        }

        .qr-modal-hint {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
        }

        .qr-modal-img-wrap {
            background: white;
            padding: 8px;
            display: inline-block;
            border: 1px solid #e8e4dc;
        }

        .qr-modal-img-wrap img {
            display: block;
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        .qr-modal-close {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: 1px solid #d8d2c8;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            background: transparent;
            color: #666;
        }

        .qr-modal-close:active {
            background: #f5f2ec;
        }

        /* Map modal */
        .map-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .map-modal {
            background: white;
            border: 1px solid #d8d2c8;
            border-bottom: none;
            padding: 16px 14px 20px;
            width: 100%;
            max-width: 480px;
        }

        .map-modal-title {
            font-size: 15px;
            font-weight: 600;
            color: #3a2a2a;
            text-align: center;
            margin-bottom: 4px;
        }

        .map-modal-addr {
            font-size: 13px;
            color: #999;
            text-align: center;
            margin-bottom: 12px;
        }

        .map-modal-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #d8d2c8;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            background: white;
            color: #3a2a2a;
        }

        .map-modal-btn:active {
            background: #f5f2ec;
        }

        .map-modal-cancel {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            background: transparent;
            color: #999;
        }

        .map-modal-cancel:active {
            background: #f5f2ec;
        }

        /* Responsive */
        @media (min-width: 500px) {
            .container { padding: 20px; }
            .cal-tag { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            <div class="spinner"></div>
            加载中...
        </div>
    </div>

    <script>
    (function() {
        const WEEKDAY_LABELS = ['一', '二', '三', '四', '五', '六', '日'];
        const DAY_KEYS = { 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六', 0: '日' };
        const PERIODS = ['上午', '下午'];
        const LOCATION_COLORS = {
            '东城': '#4a6b5a',
            '博爱堂': '#7a6328',
            '弘医堂': '#854530',
            '国医堂': '#3a4a6a',
            '停诊': '#8d1f29'
        };

        let scheduleData;
        let viewMode = 'current';

        function init() {
            loadSchedule();
        }

        async function loadSchedule() {
            try {
                const resp = await fetch('schedule.json?t=' + Date.now());
                if (!resp.ok) throw new Error('Network error');
                scheduleData = await resp.json();
                viewMode = 'current';
                render();
            } catch (e) {
                document.getElementById('app').innerHTML =
                    '<div class="loading">数据加载失败，请稍后刷新重试</div>';
            }
        }

        function getActiveData() {
            if (viewMode === 'next' && scheduleData.next) {
                var n = scheduleData.next;
                return {
                    doctor: scheduleData.doctor,
                    month: n.month,
                    regular: n.regular,
                    exceptions: n.exceptions || {},
                    locations: scheduleData.locations,
                    notice: scheduleData.notice
                };
            }
            return scheduleData;
        }

        function render() {
            const data = getActiveData();
            const [year, month] = data.month.split('-').map(Number);
            const displayMonth = month - 1;
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === displayMonth;
            const todayDate = isCurrentMonth ? today.getDate() : -1;

            const firstDay = new Date(year, displayMonth, 1);
            const lastDay = new Date(year, displayMonth + 1, 0);
            const startDow = (firstDay.getDay() + 6) % 7;
            const totalDays = lastDay.getDate();

            const monthStr = year + '年' + month + '月';
            const [curY, curM] = scheduleData.month.split('-').map(Number);
            const currentMonthStr = curY + '年' + curM + '月';

            let html = '';

            // Header
            html += '<div class="header">';
            html += '<h1>' + data.doctor + '</h1>';
            html += '<div class="subtitle">' + monthStr + ' 出诊安排</div>';
            html += '</div>';

            // Month nav
            if (scheduleData.next) {
                html += '<div class="month-tabs">';
                html += '<button class="month-tab' + (viewMode === 'current' ? ' active' : '') + '" onclick="app.switchMonth(\'current\')">';
                html += currentMonthStr + '</button>';

                const [nextY, nextM] = scheduleData.next.month.split('-').map(Number);
                const nextMonthStr = nextY + '年' + nextM + '月';
                html += '<button class="month-tab' + (viewMode === 'next' ? ' active' : '') + '" onclick="app.switchMonth(\'next\')">';
                html += nextMonthStr + '</button>';
                html += '</div>';
            }

            // Calendar grid
            html += '<div class="calendar">';
            html += '<div class="cal-grid">';

            html += '<div class="cal-header">';
            html += '<div class="cal-corner"></div>';
            WEEKDAY_LABELS.forEach(function(label) {
                html += '<div class="cal-weekday">' + label + '</div>';
            });
            html += '</div>';

            var totalWeeks = Math.ceil((startDow + totalDays) / 7);

            for (var w = 0; w < totalWeeks; w++) {
                var weekStart = w * 7 - startDow + 1;

                html += '<div class="cal-week">';

                PERIODS.forEach(function(period) {
                    var periodClass = period === '上午' ? 'am' : 'pm';
                    html += '<div class="cal-period ' + periodClass + '">' + period + '</div>';
                    for (var dow = 0; dow < 7; dow++) {
                        var dayNum = weekStart + dow;
                        if (dayNum >= 1 && dayNum <= totalDays) {
                            var date = new Date(year, displayMonth, dayNum);
                            var dateStr = formatDate(date);
                            var dayDow = date.getDay();
                            var dk = DAY_KEYS[dayDow];
                            var isToday = (dayNum === todayDate);

                            var loc = '';
                            var exc = data.exceptions && data.exceptions[dateStr];

                            if (typeof exc === 'string') {
                                loc = (period === '上午') ? exc : '';
                            } else {
                                if (exc && exc[period]) {
                                    loc = exc[period];
                                } else {
                                    var key = dk + period;
                                    if (data.regular && data.regular[key]) {
                                        loc = data.regular[key];
                                    }
                                }
                            }

                            var classes = 'cal-cell ' + periodClass;
                            if (isToday) classes += ' today';
                            if (loc) classes += ' has-schedule';

                            html += '<div class="' + classes + '">';
                            html += '<span class="cal-day-num">' + dayNum + '</span>';
                            if (loc) {
                                html += '<span class="cal-tag cal-tag-' + loc + '">' + loc + '</span>';
                            }
                            html += '</div>';
                        } else {
                            html += '<div class="cal-cell"></div>';
                        }
                    }
                });

                html += '</div>';
            }

            html += '</div>';
            html += '</div>';

            // Legend
            html += '<div class="legend">';
            Object.keys(LOCATION_COLORS).forEach(function(name) {
                if (name === '停诊') return;
                html += '<div class="legend-item">';
                html += '<div class="legend-dot" style="background:' + LOCATION_COLORS[name] + '"></div>';
                html += '<span>' + name + '</span>';
                html += '</div>';
            });
            html += '</div>';

            // Notice
            if (data.notice) {
                html += '<div class="notice">';
                html += '<strong>提示：</strong>' + data.notice;
                html += '</div>';
            }

            // Locations
            if (data.locations) {
                var locTimes = buildLocationTimes(data.regular);

                html += '<div class="loc-section">';
                html += '<div class="loc-section-title">出诊地点</div>';
                html += '<div class="loc-list">';

                Object.keys(data.locations).forEach(function(key) {
                    var loc = data.locations[key];
                    html += '<div class="loc-item">';
                    html += '<div class="loc-name">' + loc.full + '</div>';
                    html += '<div class="loc-detail">';
                    if (locTimes[key]) {
                        html += '<span class="loc-label">时间：</span>' + locTimes[key] + '<br>';
                    }
                    if (loc.phone) {
                        html += '<span class="loc-label">电话：</span>';
                        html += '<a href="tel:' + loc.phone.replace(/-/g, '') + '">' + loc.phone + '</a><br>';
                    }
                    if (loc.address) {
                        html += '<span class="loc-label">地址：</span>';
                        if (loc.lat && loc.lng) {
                            html += '<a href="javascript:void(0)" onclick="app.openMap(\'' + loc.lat + '\',\'' + loc.lng + '\',\'' + encodeURIComponent(loc.full) + '\',\'' + encodeURIComponent(loc.address) + '\')">' + loc.address + '</a>';
                        } else {
                            html += loc.address;
                        }
                        html += '<br>';
                    }
                    html += '</div>';
                    if (loc.qrcode) {
                        html += '<button class="loc-book-btn" onclick="app.openQR(\'' + key + '\',\'' + encodeURIComponent(loc.full) + '\')">预约挂号</button>';
                    }
                    html += '</div>';
                });

                html += '</div>';
                html += '</div>';
            }

            // Footer
            html += '<div class="footer">最后更新：' + data.month + '</div>';

            document.getElementById('app').innerHTML = html;
        }

        function formatDate(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function buildLocationTimes(regular) {
            if (!regular) return {};
            var DAY_NAMES = {'一':'周一','二':'周二','三':'周三','四':'周四','五':'周五','六':'周六','日':'周日'};
            var map = {};
            Object.keys(regular).forEach(function(key) {
                var m = key.match(/^([一二三四五六日])(上午|下午)$/);
                if (!m) return;
                var loc = regular[key];
                var timeStr = '每' + DAY_NAMES[m[1]] + m[2];
                if (!map[loc]) map[loc] = [];
                map[loc].push(timeStr);
            });
            Object.keys(map).forEach(function(loc) {
                map[loc] = map[loc].join('、');
            });
            return map;
        }

        window.app = {
            switchMonth: function(mode) {
                viewMode = mode;
                render();
            },
            openMap: function(lat, lng, nameEnc, addrEnc) {
                var name = decodeURIComponent(nameEnc);
                var addr = decodeURIComponent(addrEnc);
                var tencentUrl = 'https://apis.map.qq.com/uri/v1/marker?marker=coord:' + lat + ',' + lng + ';title:' + nameEnc + ';addr:' + addrEnc + '&referer=doctor_schedule';
                var gaodeUrl = 'https://uri.amap.com/marker?position=' + lng + ',' + lat + '&name=' + nameEnc + '&address=' + addrEnc + '&coordinate=gaode&callnative=0';
                var baiduUrl = 'https://api.map.baidu.com/marker?location=' + lat + ',' + lng + '&title=' + nameEnc + '&content=' + addrEnc + '&output=html';

                var overlay = document.createElement('div');
                overlay.className = 'map-modal-overlay';
                overlay.innerHTML = '<div class="map-modal">' +
                    '<div class="map-modal-title">选择地图</div>' +
                    '<div class="map-modal-addr">' + name + '</div>' +
                    '<button class="map-modal-btn" onclick="window.location.href=\'' + tencentUrl + '\'">腾讯地图</button>' +
                    '<button class="map-modal-btn" onclick="window.location.href=\'' + gaodeUrl + '\'">高德地图</button>' +
                    '<button class="map-modal-btn" onclick="window.location.href=\'' + baiduUrl + '\'">百度地图</button>' +
                    '<button class="map-modal-cancel" onclick="this.parentNode.parentNode.removeChild(this.parentNode)">取消</button>' +
                    '</div>';
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) overlay.parentNode.removeChild(overlay);
                });
                document.body.appendChild(overlay);
            },
            openQR: function(key, nameEnc) {
                var name = decodeURIComponent(nameEnc);
                var loc = scheduleData.locations[key];
                if (!loc || !loc.qrcode) return;

                var overlay = document.createElement('div');
                overlay.className = 'qr-modal-overlay';
                overlay.innerHTML = '<div class="qr-modal">' +
                    '<div class="qr-modal-title">' + name + '</div>' +
                    '<div class="qr-modal-hint">长按识别关注公众号预约挂号</div>' +
                    '<div class="qr-modal-img-wrap"><img src="' + loc.qrcode + '" alt="' + name + '公众号"></div>' +
                    '<button class="qr-modal-close" onclick="this.parentNode.parentNode.removeChild(this.parentNode)">关闭</button>' +
                    '</div>';
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) overlay.parentNode.removeChild(overlay);
                });
                document.body.appendChild(overlay);
            }
        };

        init();
    })();
    </script>
</body>
</html>
